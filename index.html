<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOXEL - Explore The Mod Galaxy</title>

<style>
:root{
--bg:#050816;
--card:#0c1228;
--card2:#131d3b;
--cyan:#25dfff;
--purple:#8c52ff;
--white:#ffffff;
--text:#d8e7ff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:linear-gradient(180deg,#030713,#081225,#0b1630);
color:var(--white);
overflow-x:hidden;
min-height:100vh;
}

#stars,#stars2,#stars3{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}

.star{
position:absolute;
background:white;
border-radius:50%;
animation:twinkle 4s infinite;
}

@keyframes twinkle{
0%,100%{opacity:.2}
50%{opacity:1}
}

header{
position:sticky;
top:0;
z-index:50;
background:rgba(3,7,19,.85);
backdrop-filter:blur(10px);
padding:15px 5%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
font-size:32px;
font-weight:900;
background:linear-gradient(90deg,var(--cyan),var(--purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.admin-btn{
background:linear-gradient(90deg,var(--purple),var(--cyan));
border:none;
padding:10px 18px;
border-radius:12px;
color:white;
cursor:pointer;
font-weight:bold;
}

.hero{
text-align:center;
padding:110px 20px 60px;
}

.hero h1{
font-size:70px;
font-weight:900;
background:linear-gradient(90deg,var(--cyan),#fff,var(--purple));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.hero p{
color:#c6d3ff;
font-size:22px;
margin-top:10px;
}

.search-box{
max-width:700px;
margin:35px auto;
}

.search-box input{
width:100%;
padding:18px;
border-radius:16px;
border:none;
outline:none;
font-size:18px;
background:rgba(255,255,255,.08);
color:white;
}

.banner{
margin:0 auto 40px;
max-width:1100px;
background:linear-gradient(90deg,var(--purple),var(--cyan));
padding:24px;
border-radius:20px;
font-size:25px;
font-weight:700;
text-align:center;
}

.categories{
display:flex;
flex-wrap:wrap;
gap:12px;
justify-content:center;
padding:0 20px 35px;
}

.category-btn{
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.1);
color:white;
padding:12px 16px;
border-radius:50px;
cursor:pointer;
transition:.3s;
}

.category-btn:hover{
transform:translateY(-4px);
background:var(--purple);
}

.section-title{
font-size:32px;
margin:40px 5% 20px;
}

.mods-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:24px;
padding:0 5% 60px;
}

.mod-card{
background:linear-gradient(180deg,var(--card),var(--card2));
border-radius:20px;
overflow:hidden;
transition:.3s;
border:1px solid
